# Minimal SearXNG settings for local use by Sodeom
use_default_settings: true

general:
  debug: false
  instance_name: "Sodeom Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8888
  bind_address: "127.0.0.1"
  secret_key: "sodeom-searxng-local-secret-key-change-in-prod"
  base_url: "http://localhost:8888/"
  image_proxy: false
  http_protocol_version: "1.0"
  method: "GET"

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: dark

# Outgoing HTTP settings
outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  # Use local proxy that forwards to Cloudflare Worker
  proxies:
    all://:
      - http://127.0.0.1:8080/
  using_tor_proxy: false
  extra_proxy_timeout: 5

engines:
  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false

  - name: youtube
    engine: youtube_noapi
    shortcut: yt
    disabled: false

  - name: vimeo
    engine: vimeo
    shortcut: vm
    disabled: false

  - name: dailymotion
    engine: dailymotion
    shortcut: dm
    disabled: false

  - name: google images
    engine: google_images
    shortcut: gimg
    disabled: false

  - name: bing images
    engine: bing_images
    shortcut: bimg
    disabled: false

  - name: google news
    engine: google_news

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sodi - Innovating the Future{% endblock %}</title>

  <link rel="icon" href="/favicon.ico" />
  <!-- Google Font for company name -->
  <link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
  <!-- Link to your CSS file -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-y3qCQgdZyE9ZBxc8sN_YA.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

</head>
<body>
  <!-- Header -->
  <header>
    <div class="container header-container">
      <h1 class="company-name"><a href="/">Sodi</a></h1>
      <nav>
        <ul>
          <li><a href=/>Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  {% block content %}
  {% endblock %}

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2025 Sodi. All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
